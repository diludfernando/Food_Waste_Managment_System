version: '3.8'

services:
  # Database Service: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: food_waste_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: food_waste_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_waste_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API Service: Node.js Express + Prisma
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_waste_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres_secure_password@postgres:5432/food_waste_db?schema=public"
      JWT_SECRET: supersecret_jwt_key_change_in_production_32bytes
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node src/server.js"

  # Frontend Web Service: React + Nginx
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_BASE_URL: http://localhost:5000
    container_name: food_waste_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
